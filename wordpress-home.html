<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Geezer</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

.nc-outer{
  font-family:'Montserrat',sans-serif;
  background:#F3F4F8;
  padding:40px 40px 60px;
}
@media(max-width:767px){
  .nc-outer{padding:24px 16px 40px;}
}
.nc-box{
  background:#fff !important;
  border-radius:20px !important;
  box-shadow:0 4px 4px rgba(0,0,0,.25) !important;
  padding:24px 40px 48px !important;
  position:relative !important;
  overflow:hidden !important;
}
@media(max-width:767px){
  .nc-box{padding:24px 16px 32px !important;}
}

/* setas — canto superior direito do box */
.nc-btns{
  position:absolute !important;
  top:20px !important;
  right:20px !important;
  display:flex !important;
  gap:10px !important;
  z-index:20 !important;
}
.nc-btn{
  width:44px !important;
  height:44px !important;
  border-radius:50% !important;
  border:none !important;
  background:#F3F4F8 !important;
  cursor:pointer !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  transition:background .2s !important;
  padding:0 !important;
  margin:0 !important;
  box-shadow:0 2px 6px rgba(0,0,0,.15) !important;
  line-height:1 !important;
}
.nc-btn svg{display:block !important;flex-shrink:0 !important;}
.nc-btn:hover{background:#e0e1e5 !important;}
.nc-btn:disabled{opacity:.3 !important;cursor:default !important;}

.nc-ow{overflow:hidden !important;margin-top:16px !important;}
.nc-track{
  display:flex !important;
  gap:26px !important;
  transition:transform .45s cubic-bezier(.4,0,.2,1) !important;
  align-items:flex-start !important;
}
.nc-card{
  min-width:300px !important;
  width:300px !important;
  height:300px !important;
  background:#F3F4F8 !important;
  border-radius:15px !important;
  overflow:hidden !important;
  flex-shrink:0 !important;
  display:flex !important;
  flex-direction:column !important;
}
.nc-card-img{
  width:300px !important;
  height:169px !important;
  min-height:169px !important;
  object-fit:cover !important;
  display:block !important;
  border-radius:15px 15px 0 0 !important;
  flex-shrink:0 !important;
}
.nc-card-noi{
  width:300px !important;
  height:169px !important;
  min-height:169px !important;
  background:#e8e8e8 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  color:#bbb !important;
  font-size:40px !important;
  border-radius:15px 15px 0 0 !important;
  flex-shrink:0 !important;
}
.nc-card-body{padding:14px 16px 18px !important;flex:1 !important;}
.nc-card-name{font-size:18px !important;font-weight:700 !important;color:#000 !important;margin-bottom:6px !important;line-height:1.3 !important;}
.nc-card-desc{font-size:13px !important;font-weight:400 !important;color:#000 !important;line-height:1.65 !important;}
</style>
</head>
<body>

<div class="nc-outer">
  <div class="nc-box">
    <div class="nc-btns">
      <button class="nc-btn" id="nc-prev" disabled>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 4L6 9L11 14" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="nc-btn" id="nc-next">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 4L12 9L7 14" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="nc-ow">
      <div class="nc-track" id="nc-track"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrdnpubW1paWlsanlya29waXF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODI3NzEsImV4cCI6MjA4MTY1ODc3MX0.fDfad8H_91BPgM3pHQFZ2vadIrqdSuElwlT_i4JBdB4';
  var BASE='https://dkvznmmiiiljyrkopiqx.supabase.co/rest/v1/rpc/';
  var H={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};
  function rpc(n){return fetch(BASE+n,{method:'POST',headers:H}).then(function(r){return r.json();});}

  var offset=0, CW=326, vis=3, total=0;

  function updArrows(){
    document.getElementById('nc-prev').disabled = offset<=0;
    document.getElementById('nc-next').disabled = offset>=(total-vis);
  }
  function slide(d){
    offset = Math.max(0, Math.min(offset+d, total-vis));
    document.getElementById('nc-track').style.transform = 'translateX(-'+(offset*CW)+'px)';
    updArrows();
  }
  document.getElementById('nc-prev').onclick = function(){slide(-1);};
  document.getElementById('nc-next').onclick = function(){slide(1);};

  function calcVis(){
    var ow = document.querySelector('.nc-ow');
    if(ow) vis = Math.max(1, Math.floor(ow.offsetWidth/CW));
    updArrows();
  }
  window.addEventListener('resize', calcVis);

  rpc('get_nossas_cervejas').then(function(data){
    var items = (data.items || []);
    total = items.length;
    document.getElementById('nc-track').innerHTML = items.map(function(it){
      var img = it.image_url
        ? '<img class="nc-card-img" src="'+it.image_url+'" alt="'+it.name+'" loading="lazy">'
        : '<div class="nc-card-noi">🍺</div>';
      return '<div class="nc-card">'+img
        +'<div class="nc-card-body">'
        +'<div class="nc-card-name">'+it.name+'</div>'
        +(it.description?'<div class="nc-card-desc">'+it.description+'</div>':'')
        +'</div></div>';
    }).join('');
    calcVis();
  }).catch(function(){});
})();
</script>
</body>
</html>

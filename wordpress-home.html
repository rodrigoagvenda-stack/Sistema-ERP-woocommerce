<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Geezer</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ══ MOSAICO ══ */
.gz-wrap{
  font-family:'Montserrat',sans-serif;
  background:#fff;
  padding:40px 20px 56px;
}

/* grade em arco — alinha base de todas as colunas */
.gz-arch{
  display:flex;
  gap:8px;
  align-items:flex-end;
  justify-content:center;
  max-width:1140px;
  margin:0 auto 40px;
}
.gz-col{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.gz-col img{
  width:100%;
  display:block;
  object-fit:cover;
  border-radius:16px;
  flex-shrink:0;
}

/* texto centralizado abaixo do arco */
.gz-copy{
  text-align:center;
  max-width:560px;
  margin:0 auto;
}
.gz-pill{
  display:inline-block;
  border:1.5px solid #ccc;
  border-radius:999px;
  padding:6px 20px;
  font-size:13px;
  font-weight:500;
  color:#555;
  margin-bottom:20px;
  letter-spacing:.3px;
}
.gz-copy h1{
  font-size:clamp(26px,4vw,46px);
  font-weight:800;
  color:#111;
  line-height:1.15;
  letter-spacing:-1.2px;
}
.gz-copy h1 span{
  display:block;
  font-weight:400;
  color:#888;
  font-size:clamp(22px,3.5vw,40px);
}
.gz-copy p{
  margin-top:14px;
  font-size:15px;
  color:#999;
  line-height:1.7;
}

/* responsive: esconde colunas externas em telas pequenas */
@media(max-width:860px){
  .gz-col-outer{display:none;}
}
@media(max-width:560px){
  .gz-col-mid{display:none;}
  .gz-arch{gap:6px;}
}

/* ══ SLIDER CERVEJAS ══ */
.nc-section{
  font-family:'Montserrat',sans-serif;
  background:#fff;
  padding:40px 40px 60px;
  max-width:1200px;
  margin:0 auto;
}
.nc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;}
.nc-header h2{font-size:clamp(20px,2.8vw,34px);font-weight:800;color:#111;line-height:1.2;max-width:400px;}
.nc-arrows{display:flex;gap:10px;align-items:center;flex-shrink:0;}
.nc-arrow{width:42px;height:42px;border-radius:50%;border:none;background:#111;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;flex-shrink:0;}
.nc-arrow:hover{background:#f4b522;transform:scale(1.08);}
.nc-arrow:disabled{background:#e0e0e0;color:#aaa;cursor:default;transform:none;}
.nc-track-wrap{overflow:hidden;}
.nc-track{display:flex;gap:16px;transition:transform .45s cubic-bezier(.4,0,.2,1);align-items:stretch;}
.nc-featured{width:240px;min-width:240px;background:#111;border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;flex-shrink:0;}
.nc-featured img.nc-logo{height:40px;object-fit:contain;object-position:left;margin-bottom:auto;display:block;}
.nc-featured-text{margin-top:24px;}
.nc-featured-text h3{font-size:17px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:8px;}
.nc-featured-text p{font-size:12px;color:#888;line-height:1.65;}
.nc-card{min-width:190px;width:190px;background:#f7f7f7;border-radius:20px;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease;}
.nc-card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.10);}
.nc-card img{width:100%;height:220px;object-fit:cover;display:block;}
.nc-card-no-img{width:100%;height:220px;background:#e8e8e8;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:36px;}
.nc-card-body{padding:14px 16px 18px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;}
.nc-card-name{font-size:14px;font-weight:700;color:#111;margin-bottom:3px;}
.nc-card-cat{font-size:11px;color:#999;margin-bottom:8px;}
.nc-stars{display:flex;gap:2px;}
.nc-star{font-size:13px;color:#e5e7eb;}
.nc-star.on{color:#f59e0b;}
.nc-row{display:flex;gap:16px;align-items:stretch;}
@media(max-width:700px){
  .nc-section{padding:28px 16px 40px;}
  .nc-featured{width:190px;min-width:190px;}
  .nc-card{min-width:160px;width:160px;}
  .nc-card img{height:180px;}
}
</style>
</head>
<body>

<!-- MOSAICO -->
<div class="gz-wrap">
  <div class="gz-arch" id="gz-arch">
    <!-- col 1 outer (some on mobile) -->
    <div class="gz-col gz-col-outer" id="gz-c1"></div>
    <!-- col 2 mid -->
    <div class="gz-col gz-col-mid" id="gz-c2"></div>
    <!-- col 3 -->
    <div class="gz-col" id="gz-c3"></div>
    <!-- col 4 centro esq — mais alta -->
    <div class="gz-col" id="gz-c4"></div>
    <!-- col 5 centro dir — mais alta -->
    <div class="gz-col" id="gz-c5"></div>
    <!-- col 6 -->
    <div class="gz-col" id="gz-c6"></div>
    <!-- col 7 mid -->
    <div class="gz-col gz-col-mid" id="gz-c7"></div>
    <!-- col 8 outer -->
    <div class="gz-col gz-col-outer" id="gz-c8"></div>
  </div>

  <div class="gz-copy">
    <div class="gz-pill" id="gz-pill">Nossas Cervejas</div>
    <h1 id="gz-title-main">Cervejas artesanais<span id="gz-title-sub">pra quem entende de sabor</span></h1>
    <p id="gz-desc"></p>
  </div>
</div>

<!-- SLIDER -->
<div class="nc-section">
  <div class="nc-header">
    <h2 id="nc-title">Explore nossas cervejas</h2>
    <div class="nc-arrows">
      <button class="nc-arrow" id="nc-prev" disabled>&#8592;</button>
      <button class="nc-arrow" id="nc-next">&#8594;</button>
    </div>
  </div>
  <div class="nc-row">
    <div class="nc-featured">
      <img class="nc-logo" id="nc-logo" alt="Logo" style="display:none;" onerror="this.style.display='none'">
      <div class="nc-featured-text">
        <h3 id="nc-feat-title">Nossas Cervejas</h3>
        <p id="nc-feat-desc"></p>
      </div>
    </div>
    <div class="nc-track-wrap" style="flex:1;overflow:hidden;">
      <div class="nc-track" id="nc-track"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrdnpubW1paWlsanlya29waXF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODI3NzEsImV4cCI6MjA4MTY1ODc3MX0.fDfad8H_91BPgM3pHQFZ2vadIrqdSuElwlT_i4JBdB4';
  var BASE='https://dkvznmmiiiljyrkopiqx.supabase.co/rest/v1/rpc/';
  var heads={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};
  function rpc(n){return fetch(BASE+n,{method:'POST',headers:heads}).then(function(r){return r.json();});}

  /*
    Estrutura de colunas (espelhada, fundo alinhado):
    c1[130,130] c2[120,155] c3[385] c4[460] c5[460] c6[385] c7[120,155] c8[130,130]
    Total slots: 2+2+1+1+1+1+2+2 = 12 fotos
  */
  var COLS=[
    {id:'gz-c1', h:[130,130]},
    {id:'gz-c2', h:[120,155]},
    {id:'gz-c3', h:[385]},
    {id:'gz-c4', h:[460]},
    {id:'gz-c5', h:[460]},
    {id:'gz-c6', h:[385]},
    {id:'gz-c7', h:[120,155]},
    {id:'gz-c8', h:[130,130]}
  ];

  rpc('get_home_page').then(function(data){
    var photos=data.photos||[];
    if(!photos.length){document.getElementById('gz-arch').style.display='none';return;}
    var idx=0;
    COLS.forEach(function(col){
      var el=document.getElementById(col.id);
      if(!el)return;
      col.h.forEach(function(h){
        var p=photos[idx%photos.length]; idx++;
        var img=document.createElement('img');
        img.src=p.image_url; img.alt=''; img.loading='lazy';
        img.style.height=h+'px';
        el.appendChild(img);
      });
    });
  }).catch(function(){});

  /* ── SLIDER ── */
  var offset=0,cardW=206,visibleCount=3,totalCards=0;
  function stars(r){var s='',v=parseFloat(r)||0;for(var i=0;i<5;i++)s+='<span class="nc-star'+(i<v?' on':'')+'">&#9733;</span>';return s;}
  function updateArrows(){document.getElementById('nc-prev').disabled=offset<=0;document.getElementById('nc-next').disabled=offset>=totalCards-visibleCount;}
  function slide(d){offset=Math.max(0,Math.min(offset+d,totalCards-visibleCount));document.getElementById('nc-track').style.transform='translateX(-'+(offset*cardW)+'px)';updateArrows();}
  document.getElementById('nc-prev').onclick=function(){slide(-1);};
  document.getElementById('nc-next').onclick=function(){slide(1);};
  function calcVisible(){var w=document.querySelector('.nc-track-wrap');if(w)visibleCount=Math.max(1,Math.floor(w.offsetWidth/cardW));updateArrows();}
  window.addEventListener('resize',calcVisible);

  rpc('get_nossas_cervejas').then(function(data){
    var cfg=data.config||{}, items=data.items||[];

    /* logo */
    if(cfg.logo_url){
      var nl=document.getElementById('nc-logo');
      if(nl){nl.src=cfg.logo_url;nl.style.display='block';}
    }

    /* textos */
    var t=cfg.page_title||'Nossas Cervejas';
    var pill=document.getElementById('gz-pill');
    if(pill) pill.textContent=t;
    document.getElementById('nc-feat-title').textContent=t;
    document.getElementById('nc-title').textContent='Explore nossas cervejas';

    if(cfg.page_description){
      document.getElementById('gz-desc').textContent=cfg.page_description;
      document.getElementById('nc-feat-desc').textContent=cfg.page_description;
    }

    /* cards */
    totalCards=items.length;
    document.getElementById('nc-track').innerHTML=items.map(function(item){
      var img=item.image_url
        ?'<img src="'+item.image_url+'" alt="'+item.name+'" loading="lazy">'
        :'<div class="nc-card-no-img">🍺</div>';
      return '<div class="nc-card">'+img
        +'<div class="nc-card-body">'
        +'<div class="nc-card-name">'+item.name+'</div>'
        +(item.category?'<div class="nc-card-cat">'+item.category+'</div>':'')
        +'<div class="nc-stars">'+stars(item.rating)+'</div>'
        +'</div></div>';
    }).join('');
    calcVisible();
  }).catch(function(){});
})();
</script>
</body>
</html>
